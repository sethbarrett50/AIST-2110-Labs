name: Cell Output Check

on:
  pull_request:
  push:
    branches: ["**"]

jobs:
  notebook-cleanliness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Sync dependencies (uv)
        run: make sync

      - name: Check notebooks have no outputs
        run: make check-out
