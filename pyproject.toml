[project]
name = "inclasscode"
version = "0.1.9"
description = "Code examples for in-class demonstrations for AIST 2110 at Augusta University"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "IPython==9.5.0",
    "beautifulsoup4>=4.15.0",
    "ipykernel==7.4.0",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.deptry]
root = ["src"]

[tool.deptry.per_rule_ignores]
DEP001 = ["grades", "grade_formatter"]
DEP002 = ["IPython", "ipykernel"]